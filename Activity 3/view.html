<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troop · Clash Troops</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* Clash of Clans palette: Village Green #5BA331, Builder Gold #E8B73D, Barbarian Red #E8232E,
     Wizard Violet #7A2EE8, Wood Brown #7A5C3D, Stone Gray #9CA0A3, Sky Cyan #7AC8E0,
     Elixir Pink #FF3D9C, Dragon Orange #FF7A2E, Town Hall Black #15110F */
  :root, [data-bs-theme=dark] {
    --coc-green: #5BA331; --coc-gold: #E8B73D; --coc-red: #E8232E; --coc-violet: #7A2EE8;
    --coc-wood: #7A5C3D; --coc-stone: #9CA0A3; --coc-cyan: #7AC8E0; --coc-pink: #FF3D9C; --coc-orange: #FF7A2E;
    --bs-body-bg: #15110F;
    --bs-body-color: #f6efe4;
    --bs-secondary-color: #a99d8d;
    --bs-border-color: rgba(122,92,61,.6);
    --bs-link-color: var(--coc-gold);
    --bs-link-hover-color: var(--coc-orange);
  }
  body {
    background:
      radial-gradient(600px 400px at 90% -5%, rgba(91,163,49,.28), transparent 70%),
      radial-gradient(500px 400px at -5% 55%, rgba(255,122,46,.13), transparent 70%),
      radial-gradient(500px 400px at 100% 80%, rgba(122,46,232,.15), transparent 70%),
      #15110F;
    background-attachment: fixed;
    min-height: 100vh;
  }
  .navbar { backdrop-filter: blur(14px); background: rgba(21,17,15,.78); border-bottom: 3px solid var(--coc-gold); }
  .brand-mark { background: linear-gradient(135deg, var(--coc-gold), var(--coc-green)); color: #15110F !important; font-weight: 900; letter-spacing: .04em; padding: .35rem .9rem; border-radius: .6rem; }
  .navbar .nav-link { color: #f6efe4; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: .85rem; }
  .navbar .nav-link:hover { color: var(--coc-gold); }

  .btn-coc { --bs-btn-color: #15110F; --bs-btn-hover-color: #15110F; --bs-btn-active-color: #15110F; border: 0; font-weight: 800;
    background: linear-gradient(135deg, var(--coc-gold), var(--coc-green)); box-shadow: 0 0 26px rgba(232,183,61,.28); }
  .btn-coc:hover { filter: brightness(1.1); box-shadow: 0 0 38px rgba(232,183,61,.5); }
  .btn-ghost { --bs-btn-color: #f6efe4; --bs-btn-border-color: var(--coc-wood); --bs-btn-hover-bg: rgba(122,92,61,.35);
    --bs-btn-hover-border-color: var(--coc-gold); --bs-btn-hover-color: #fff; --bs-btn-active-bg: rgba(122,92,61,.5); font-weight: 700; }
  .badge-fav { background: var(--coc-pink); color: #15110F; }

  .glass { background: rgba(255,240,220,.05); border: 1px solid var(--bs-border-color); backdrop-filter: blur(10px); }
  .stat b { display: block; font-size: 1.4rem; color: var(--c, var(--coc-gold)); }
  .stat small { font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bs-secondary-color); }
  h2.sec { font-weight: 900; text-transform: uppercase; letter-spacing: .02em; border-left: 6px solid var(--c, var(--coc-gold)); padding-left: .9rem; }

  .troop-card { --c: var(--coc-green); --t: #fff; background: rgba(255,240,220,.05); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 12%, transparent); border-radius: 1.2rem; overflow: hidden; transition: transform .2s, box-shadow .2s; }
  a.troop-card:hover { transform: translateY(-6px); box-shadow: 0 0 36px color-mix(in srgb, var(--c) 45%, transparent); }
  .pic { position: relative; aspect-ratio: 4 / 5; background: #0d0a08; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 7rem; font-weight: 900; color: var(--c);
    background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 35%, transparent), #0d0a08 75%); text-shadow: 0 0 30px var(--c); }
  .more .pic { border-bottom: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
  .more .ph { font-size: 4rem; }
  .tag { background: var(--c); color: var(--t); font-weight: 800; border-radius: .35rem; font-size: .72rem; padding: .3em .7em; }
  .tag.soft { background: rgba(156,160,163,.2); color: #f6efe4; font-weight: 600; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand brand-mark" href="index.html#/home">CLASH TROOPS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
        <li class="nav-item"><a class="nav-link" href="index.html#/home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#/troops">Troops</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#/favorites">Favorites <span class="badge badge-fav" id="favCount">0</span></a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#/about">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <a href="index.html#/troops" class="btn btn-ghost btn-sm mb-4">&larr; Back to Troops</a>
  <div id="error"></div>
  <div id="loading" class="text-secondary py-5 text-center">Loading troop…</div>

  <div id="view" class="d-none">
    <!-- SECTION: HEADER -->
    <div class="row g-4 g-lg-5">
      <div class="col-md-5 col-lg-4">
        <div class="troop-card"><div class="pic" id="pic"></div></div>
      </div>
      <div class="col-md-7 col-lg-8">
        <div class="small text-uppercase text-secondary" style="letter-spacing:.15em" id="kicker"></div>
        <h1 class="display-4 fw-bolder text-break mb-2" id="name"></h1>
        <div class="d-flex flex-wrap gap-1 mb-3" id="tags"></div>
        <p class="lead text-secondary" id="desc"></p>
        <div class="d-flex flex-wrap gap-2 mt-4">
          <button class="btn btn-coc btn-lg px-4" id="favBtn">♡ Save</button>
          <a class="btn btn-ghost btn-lg" id="prevBtn" href="#">&larr; Previous</a>
          <a class="btn btn-ghost btn-lg" id="nextBtn" href="#">Next &rarr;</a>
        </div>
      </div>
    </div>

    <!-- SECTION: STATS -->
    <section class="pt-5">
      <h2 class="sec h3 mb-4">Stats</h2>
      <div class="row row-cols-2 row-cols-lg-4 g-3">
        <div class="col"><div class="glass rounded-4 py-3 text-center stat"><b id="sCost">–</b><small>Training cost</small></div></div>
        <div class="col"><div class="glass rounded-4 py-3 text-center stat"><b id="sTarget">–</b><small>Favorite target</small></div></div>
        <div class="col"><div class="glass rounded-4 py-3 text-center stat"><b id="sType">–</b><small>Attack type</small></div></div>
        <div class="col"><div class="glass rounded-4 py-3 text-center stat"><b id="sLayer">–</b><small>Attacks</small></div></div>
      </div>
    </section>

    <!-- SECTION: DETAILS -->
    <section class="pt-5">
      <h2 class="sec h3 mb-4">Details</h2>
      <div class="glass rounded-4 p-4">
        <div class="row g-3">
          <div class="col-md-3 col-6"><div class="small text-secondary text-uppercase">Category</div><div class="fw-bold" id="iCat"></div></div>
          <div class="col-md-3 col-6"><div class="small text-secondary text-uppercase">First appears in</div><div class="fw-bold" id="iAppears"></div></div>
          <div class="col-md-3 col-6"><div class="small text-secondary text-uppercase">Number</div><div class="fw-bold" id="iNumber"></div></div>
          <div class="col-md-3 col-6"><div class="small text-secondary text-uppercase">Attack</div><div class="fw-bold" id="iAttack"></div></div>
        </div>
      </div>
    </section>

    <!-- SECTION: SIMILAR TROOPS -->
    <section class="pt-5 pb-5">
      <h2 class="sec h3 mb-4">Similar Troops</h2>
      <div class="row row-cols-2 row-cols-lg-4 g-4" id="moreGrid"></div>
    </section>
  </div>
</main>

<footer class="text-center text-secondary small py-4 border-top" style="border-color:var(--bs-border-color)!important">Bootstrap · HTML · API</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TARGET = {
  Any:       { c: '#5BA331', t: '#fff' },     // Village Green
  Resources: { c: '#E8B73D', t: '#15110F' },  // Builder Gold
  Defenses:  { c: '#E8232E', t: '#fff' },     // Barbarian Red
  Walls:     { c: '#FF7A2E', t: '#15110F' },  // Dragon Orange
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const tv = (c) => { const r = TARGET[c.target] ?? TARGET.Any; return `--c:${r.c};--t:${r.t}`; };
const pad = (n) => String(n).padStart(2, '0');
const pic = (c) => c.image
  ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" data-initial="${esc(c.name[0])}"${c.guess ? ` data-guess="${esc(c.guess)}"` : ''}>`
  : `<div class="ph">${esc(c.name[0])}</div>`;

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('coc-favs') || '[]')); } catch {}
const saveFavs = () => { try { localStorage.setItem('coc-favs', JSON.stringify([...favs])); } catch {} };
$('favCount').textContent = favs.size;

/* ---------- loading the troops ----------
   1) from the API (/characters) when the page is opened through `npm start`
   2) otherwise straight from characters.json, so the page also works on Live Server or any static server */
const IMG_EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'];
const slug = (n) => n.toLowerCase().replace(/\./g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
async function getJson(url) {
  const r = await fetch(url);
  const text = await r.text();
  try { return { ok: r.ok, data: JSON.parse(text) }; } catch { return { ok: false, data: null }; }
}
async function loadTroops() {
  try {
    const r = await getJson('/characters');
    if (r.ok && Array.isArray(r.data?.characters)) return r.data.characters;
  } catch { /* fall through to characters.json */ }
  try {
    const r = await getJson('characters.json');
    if (r.ok && Array.isArray(r.data)) {
      return r.data.map((c, i) => {
        const id = slug(c.name);
        return { number: i + 1, id, ...c, attack: `${c.attackType} (${c.layer})`, image: `images/${id}.${IMG_EXTS[0]}`, guess: id };
      });
    }
  } catch { /* handled below */ }
  throw new Error('load failed');
}
const LOAD_ERROR = 'Could not load the troops. Start the site with <code>npm start</code> and open <code>http://localhost:3000</code>, and make sure <code>characters.json</code> is in the same folder as this page.';

// if a picture fails to load: try the next file type, then show the first letter of the name instead
document.addEventListener('error', (e) => {
  const im = e.target;
  if (im.tagName !== 'IMG' || !im.dataset.initial) return;
  if (im.dataset.guess) {
    const i = Number(im.dataset.i || 0) + 1;
    if (i < IMG_EXTS.length) { im.dataset.i = i; im.src = `images/${im.dataset.guess}.${IMG_EXTS[i]}`; return; }
  }
  const ph = document.createElement('div');
  ph.className = 'ph'; ph.textContent = im.dataset.initial;
  im.replaceWith(ph);
}, true);

function showError(msg, html) {
  $('loading').classList.add('d-none');
  $('error').innerHTML = `<div class="alert alert-danger">${html ? msg : esc(msg)} <a href="index.html#/troops" class="alert-link">Back to Troops</a></div>`;
}

function moreCard(c) {
  return `<div class="col"><a class="card troop-card more h-100 text-decoration-none text-reset" style="${tv(c)}" href="view.html?id=${encodeURIComponent(c.id)}">
    <div class="pic">${pic(c)}</div>
    <div class="card-body"><h3 class="h6 fw-bold text-break mb-2">${esc(c.name)}</h3><span class="tag">${esc(c.attackType)}</span></div></a></div>`;
}

function render(c, all) {
  document.title = `${c.name} · Clash Troops`;
  $('view').setAttribute('style', tv(c));
  $('pic').innerHTML = pic(c);
  $('kicker').textContent = `${c.category} #${pad(c.number)} · ${c.appears}`;
  $('name').textContent = c.name;
  $('tags').innerHTML = `<span class="tag">Targets: ${esc(c.target)}</span><span class="tag soft">${esc(c.attackType)}</span><span class="tag soft">${esc(c.layer)}</span>`;
  $('desc').textContent = c.description;
  $('sCost').textContent = c.cost;
  $('sTarget').textContent = c.target;
  $('sType').textContent = c.attackType;
  $('sLayer').textContent = c.layer;
  $('iCat').textContent = c.category;
  $('iAppears').textContent = c.appears;
  $('iNumber').textContent = `${c.number} of ${all.length}`;
  $('iAttack').textContent = c.attack;

  const i = all.findIndex((x) => x.id === c.id);
  const prev = all[(i - 1 + all.length) % all.length], next = all[(i + 1) % all.length];
  $('prevBtn').href = 'view.html?id=' + encodeURIComponent(prev.id);
  $('nextBtn').href = 'view.html?id=' + encodeURIComponent(next.id);

  const paintFav = () => {
    const on = favs.has(c.id);
    $('favBtn').textContent = on ? '♥ Saved' : '♡ Save';
  };
  $('favBtn').onclick = () => {
    favs.has(c.id) ? favs.delete(c.id) : favs.add(c.id);
    saveFavs(); paintFav(); $('favCount').textContent = favs.size;
  };
  paintFav();

  // similar: same favorite target first, then same attack type, then the rest
  const score = (x) => (x.target === c.target ? 2 : 0) + (x.attackType === c.attackType ? 1 : 0);
  const similar = all.filter((x) => x.id !== c.id).sort((a, b) => score(b) - score(a) || a.number - b.number).slice(0, 4);
  $('moreGrid').innerHTML = similar.map(moreCard).join('');

  $('loading').classList.add('d-none');
  $('view').classList.remove('d-none');
}

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return showError('No troop selected.');
  let all;
  try { all = await loadTroops(); } catch { return showError(LOAD_ERROR, true); }
  const c = all.find((x) => x.id === id.toLowerCase());
  if (!c) return showError('That troop does not exist.');
  render(c, all);
}
load();
</script>
</body>
</html>
