<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Character Details</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Your design -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            ⚔️ CLASH TROOPS
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html"
                    >
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html#characters"
                    >
                        Characters
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- DETAIL -->
<section class="container py-5">

    <div id="loading" class="text-center">

        <div
            class="spinner-border text-warning"
            role="status"
        ></div>

        <p class="mt-3">
            Loading character...
        </p>

    </div>


    <div
        id="errorMessage"
        class="alert alert-danger text-center d-none"
    ></div>


    <div
        id="characterDetails"
        class="d-none"
    >

        <!-- BACK -->
        <div class="mb-4">

            <a
                href="index.html"
                class="btn btn-outline-warning"
            >
                ← Back to Characters
            </a>

        </div>


        <!-- MAIN CARD -->
        <div class="card bg-dark text-light border-warning">

            <div class="card-body">

                <div class="row align-items-center">


                    <!-- ICON -->
                    <div class="col-md-4 text-center">

                        <div
                            id="characterIcon"
                            class="display-1 mb-3"
                        >
                        </div>

                    </div>


                    <!-- INFORMATION -->
                    <div class="col-md-8">

                        <h1
                            id="characterName"
                            class="fw-bold"
                        >
                        </h1>


                        <div class="mb-3">

                            <span
                                id="characterCategory"
                                class="badge bg-warning text-dark"
                            >
                            </span>

                            <span
                                id="characterTownHall"
                                class="badge bg-secondary"
                            >
                            </span>

                        </div>


                        <p id="characterDescription"></p>


                        <div class="row g-2 mt-3">

                            <div class="col-sm-6">

                                <div class="border rounded p-3">

                                    <small>
                                        Housing Space
                                    </small>

                                    <div
                                        id="housingSpace"
                                        class="fw-bold fs-5"
                                    >
                                    </div>

                                </div>

                            </div>


                            <div class="col-sm-6">

                                <div class="border rounded p-3">

                                    <small>
                                        Damage Per Second
                                    </small>

                                    <div
                                        id="damagePerSecond"
                                        class="fw-bold fs-5"
                                    >
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- LEVELS -->
        <div class="card mt-4">

            <div class="card-body">

                <h3 class="fw-bold mb-3">
                    Character Levels
                </h3>


                <div class="table-responsive">

                    <table
                        class="table table-dark table-striped table-hover"
                    >

                        <thead>

                            <tr>

                                <th>
                                    Level
                                </th>

                                <th>
                                    DPS
                                </th>

                                <th>
                                    Upgrade Cost
                                </th>

                                <th>
                                    Town Hall
                                </th>

                            </tr>

                        </thead>


                        <tbody id="levelTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- NAVIGATION -->
        <div
            class="d-flex justify-content-between mt-4"
        >

            <button
                id="previousButton"
                class="btn btn-outline-warning"
            >
                ← Previous
            </button>


            <button
                id="nextButton"
                class="btn btn-outline-warning"
            >
                Next →
            </button>

        </div>

    </div>

</section>



<!-- FOOTER -->
<footer class="bg-dark text-light text-center py-4">

    <p class="mb-0">
        © 2026 Clash Troops | School Project
    </p>

</footer>



<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<script>

const DATA_URL =
    "https://raw.githubusercontent.com/Statscell/clash-of-clans-data/main/output/troopUpgradeStats.json";


const params =
    new URLSearchParams(window.location.search);


const characterId =
    params.get("id");


let allCharacters = [];
let currentCharacter = null;



/*
    LOAD DATA
*/
fetch(DATA_URL)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load Clash of Clans data."
            );

        }

        return response.json();

    })

    .then(data => {


        allCharacters = data

            .filter(character =>
                character.village === "home"
            )

            .filter(character =>
                character.category === "troop" ||
                character.category === "spell" ||
                character.category === "hero"
            );


        const siegeMachines = data

            .filter(character =>
                character.village === "home" &&
                character.subCategory === "siege"
            );


        allCharacters = [
            ...allCharacters,
            ...siegeMachines
        ];


        currentCharacter =
            allCharacters.find(character =>
                String(character.id) === String(characterId)
            );


        if (!currentCharacter) {

            throw new Error(
                "Character not found."
            );

        }


        displayCharacter();

        updateNavigation();


        document
            .getElementById("loading")
            .classList.add("d-none");


        document
            .getElementById("characterDetails")
            .classList.remove("d-none");

    })


    .catch(error => {

        console.error(error);


        document
            .getElementById("loading")
            .classList.add("d-none");


        const errorMessage =
            document.getElementById("errorMessage");


        errorMessage.textContent =
            error.message;


        errorMessage.classList.remove("d-none");

    });



/*
    DISPLAY CHARACTER
*/
function displayCharacter() {

    const character =
        currentCharacter;


    document.title =
        character.name + " - Clash Troops";


    document.getElementById(
        "characterName"
    ).textContent =
        character.name;


    document.getElementById(
        "characterCategory"
    ).textContent =
        getCategory(character).toUpperCase();


    document.getElementById(
        "characterTownHall"
    ).textContent =
        "TH " +
        (character.unlock?.hall ?? "—");


    document.getElementById(
        "characterDescription"
    ).textContent =
        character.description ||
        `${character.name} is a Clash of Clans ${getCategory(character)}.`;


    document.getElementById(
        "housingSpace"
    ).textContent =
        character.housingSpace ?? "—";


    document.getElementById(
        "damagePerSecond"
    ).textContent =
        getDPS(character);


    document.getElementById(
        "characterIcon"
    ).textContent =
        getIcon(getCategory(character));


    displayLevels();

}



/*
    CATEGORY
*/
function getCategory(character) {

    if (character.subCategory === "siege") {
        return "siege";
    }

    return character.category || "other";

}



/*
    ICON
*/
function getIcon(category) {

    if (category === "troop") {
        return "⚔️";
    }

    if (category === "spell") {
        return "✨";
    }

    if (category === "hero") {
        return "👑";
    }

    if (category === "siege") {
        return "🏰";
    }

    return "⚔️";

}



/*
    DPS
*/
function getDPS(character) {

    if (
        !character.dps ||
        character.dps.length === 0
    ) {

        return "—";

    }


    return character.dps[
        character.dps.length - 1
    ];

}



/*
    LEVEL TABLE
*/
function displayLevels() {

    const table =
        document.getElementById("levelTable");


    table.innerHTML = "";


    const dps =
        currentCharacter.dps || [];


    const upgrade =
        currentCharacter.upgrade || {};


    const costs =
        upgrade.cost || [];


    const hall =
        currentCharacter.unlock?.hall || "—";


    const maxLevels =
        Math.max(
            dps.length,
            costs.length
        );


    for (
        let i = 0;
        i < maxLevels;
        i++
    ) {

        const level =
            i + 1;


        const damage =
            dps[i] ?? "—";


        const cost =
            costs[i] ?? "—";


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${level}
            </td>

            <td>
                ${damage}
            </td>

            <td>
                ${formatNumber(cost)}
            </td>

            <td>
                ${hall}
            </td>

        `;


        table.appendChild(row);

    }

}



/*
    FORMAT NUMBER
*/
function formatNumber(number) {

    if (
        number === "—" ||
        number === undefined ||
        number === null
    ) {

        return "—";

    }


    return Number(number).toLocaleString();

}



/*
    PREVIOUS / NEXT
*/
function updateNavigation() {

    const currentIndex =
        allCharacters.findIndex(character =>
            String(character.id) ===
            String(characterId)
        );


    const previousButton =
        document.getElementById(
            "previousButton"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    previousButton.disabled =
        currentIndex <= 0;


    nextButton.disabled =
        currentIndex >=
        allCharacters.length - 1;



    previousButton.onclick =
        function () {

            if (currentIndex > 0) {

                const previous =
                    allCharacters[
                        currentIndex - 1
                    ];


                window.location.href =
                    "view.html?id=" +
                    encodeURIComponent(
                        previous.id
                    );

            }

        };



    nextButton.onclick =
        function () {

            if (
                currentIndex <
                allCharacters.length - 1
            ) {

                const next =
                    allCharacters[
                        currentIndex + 1
                    ];


                window.location.href =
                    "view.html?id=" +
                    encodeURIComponent(
                        next.id
                    );

            }

        };

}

</script>

</body>
</html>
