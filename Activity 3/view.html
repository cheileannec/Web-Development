<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Character Details - Clash Troops</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            ⚔️ CLASH TROOPS

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Characters

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main class="py-5">

    <div class="container">


        <div
            id="loadingMessage"
            class="text-center py-5">

            <div
                class="spinner-border"
                role="status">
            </div>

            <p class="mt-3">
                Loading character details...
            </p>

        </div>


        <div
            id="errorMessage"
            class="alert alert-danger text-center d-none">
        </div>


        <div
            id="characterDetails"
            class="d-none">


            <div class="row g-4">


                <div class="col-md-5">

                    <div class="card shadow-sm">

                        <img
                            id="characterImage"
                            class="card-img-top"
                            alt="Character"
                            style="max-height:450px; object-fit:contain; padding:20px;">

                    </div>

                </div>


                <div class="col-md-7">

                    <h1
                        id="characterName"
                        class="fw-bold">
                    </h1>


                    <span
                        id="characterCategory"
                        class="badge bg-dark mb-3">
                    </span>


                    <p
                        id="characterDescription"
                        class="lead">
                    </p>


                    <div class="row mt-4">


                        <div class="col-md-6 mb-3">

                            <div class="card">

                                <div class="card-body">

                                    <h6 class="fw-bold">
                                        Movement Speed
                                    </h6>

                                    <p
                                        id="movementSpeed"
                                        class="mb-0">
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card">

                                <div class="card-body">

                                    <h6 class="fw-bold">
                                        Attack Speed
                                    </h6>

                                    <p
                                        id="attackSpeed"
                                        class="mb-0">
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card">

                                <div class="card-body">

                                    <h6 class="fw-bold">
                                        Range
                                    </h6>

                                    <p
                                        id="range"
                                        class="mb-0">
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <div class="card">

                                <div class="card-body">

                                    <h6 class="fw-bold">
                                        Target
                                    </h6>

                                    <p
                                        id="targetType"
                                        class="mb-0">
                                    </p>

                                </div>

                            </div>

                        </div>


                    </div>

                </div>

            </div>


            <div class="mt-5">

                <h2 class="fw-bold mb-4">
                    Character Levels
                </h2>


                <div class="table-responsive">

                    <table
                        class="table table-bordered table-striped">

                        <thead class="table-dark">

                            <tr>

                                <th>Level</th>

                                <th>Hitpoints</th>

                                <th>DPS</th>

                                <th>Damage / Shot</th>

                                <th>Town Hall</th>

                                <th>Research Cost</th>

                            </tr>

                        </thead>


                        <tbody id="levelTable">
                        </tbody>

                    </table>

                </div>

            </div>


            <div class="mt-4">

                <a
                    href="index.html"
                    class="btn btn-dark">

                    ← Back to Characters

                </a>

            </div>

        </div>

    </div>

</main>


<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 Clash Troops School Project
    </p>

</footer>


<script>

const DATA_BASE =
    "https://raw.githubusercontent.com/chiefpansancolt/clash-of-clans-data/main/data/home";

const IMAGE_BASE =
    "https://raw.githubusercontent.com/chiefpansancolt/clash-of-clans-data/main/";


const params =
    new URLSearchParams(window.location.search);


const characterId =
    params.get("id");


const category =
    params.get("category");


const folderMap = {

    troops: "troops",
    spells: "spells",
    heroes: "heroes",
    siege: "siege-machines",
    pets: "pets",
    equipment: "hero-equipment"

};


async function loadCharacter() {

    try {

        if (!characterId || !category) {

            throw new Error(
                "Character information is missing."
            );

        }


        const folder =
            folderMap[category];


        if (!folder) {

            throw new Error(
                "Invalid character category."
            );

        }


        const url =
            `${DATA_BASE}/${folder}/${characterId}.json`;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Character data could not be loaded."
            );

        }


        const character =
            await response.json();


        displayCharacter(character);

    }

    catch (error) {

        document
            .getElementById("loadingMessage")
            .classList.add("d-none");


        const errorBox =
            document.getElementById("errorMessage");


        errorBox.classList.remove("d-none");


        errorBox.textContent =
            error.message;

    }

}


function displayCharacter(character) {

    document
        .getElementById("loadingMessage")
        .classList.add("d-none");


    document
        .getElementById("characterDetails")
        .classList.remove("d-none");


    /*
    IMAGE
    */

    let image = "";


    if (
        character.images &&
        character.images.icon
    ) {

        image =
            IMAGE_BASE +
            character.images.icon;

    }


    document
        .getElementById("characterImage")
        .src = image;


    document
        .getElementById("characterImage")
        .alt =
        character.name;


    /*
    BASIC DETAILS
    */

    document
        .getElementById("characterName")
        .textContent =
        character.name;


    document
        .getElementById("characterDescription")
        .textContent =
        character.description ||
        "No description available.";


    document
        .getElementById("characterCategory")
        .textContent =
        character.category ||
        category;


    document
        .getElementById("movementSpeed")
        .textContent =
        character.movementSpeed ??
        "N/A";


    document
        .getElementById("attackSpeed")
        .textContent =
        character.attackSpeed ??
        "N/A";


    document
        .getElementById("range")
        .textContent =
        character.range ??
        "N/A";


    document
        .getElementById("targetType")
        .textContent =
        character.targetType ||
        "N/A";


    /*
    LEVELS
    */

    const table =
        document.getElementById("levelTable");


    table.innerHTML = "";


    if (
        character.levels &&
        character.levels.length
    ) {

        character.levels.forEach(level => {

            const normalStats =
                level.stats?.normal || {};


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${level.level ?? "N/A"}
                </td>

                <td>
                    ${level.hitpoints ?? "N/A"}
                </td>

                <td>
                    ${normalStats.dps ?? "N/A"}
                </td>

                <td>
                    ${normalStats.damagePerShot ?? "N/A"}
                </td>

                <td>
                    ${level.townHallRequired ?? "N/A"}
                </td>

                <td>
                    ${
                        level.researchCost != null
                            ? level.researchCost.toLocaleString()
                            : "N/A"
                    }
                    ${
                        level.researchCostResource
                            ? " " + level.researchCostResource
                            : ""
                    }
                </td>

            `;


            table.appendChild(row);

        });

    }

    else {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="text-center">

                    No level information available.

                </td>

            </tr>

        `;

    }

}


loadCharacter();

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
