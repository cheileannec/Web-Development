<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Details - Clash Troops</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg clash-navbar">

    <div class="container">

        <a
            class="navbar-brand clash-logo"
            href="index.html"
        >
            ⚔ CLASH TROOPS
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html#characters"
                    >
                        Characters
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html#api"
                    >
                        API
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html#about"
                    >
                        About
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- MAIN -->
<main class="py-5">

    <div class="container">

        <!-- LOADING -->
        <div
            id="loading"
            class="text-center py-5"
        >

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p class="mt-3">
                Loading character...
            </p>

        </div>


        <!-- ERROR -->
        <div
            id="errorMessage"
            class="alert alert-danger d-none"
        ></div>


        <!-- CHARACTER DETAILS -->
        <div
            id="details"
            class="d-none"
        >

            <!-- TOP SECTION -->
            <div class="row align-items-center mb-5">

                <div class="col-md-5 mb-4 mb-md-0">

                    <div class="detail-image-box">

                        <img
                            id="characterImage"
                            src=""
                            alt=""
                            class="character-image"
                        >

                    </div>

                </div>


                <div class="col-md-7">

                    <span
                        id="characterCategory"
                        class="character-badge"
                    ></span>


                    <h1
                        id="characterName"
                        class="detail-title"
                    ></h1>


                    <p
                        id="characterDescription"
                        class="detail-description"
                    ></p>

                </div>

            </div>


            <!-- BASIC INFORMATION -->
            <section class="mb-5">

                <h2 class="section-heading-line">
                    BASIC INFORMATION
                </h2>


                <div
                    id="basicStats"
                    class="row g-3"
                ></div>

            </section>


            <!-- LEVELS -->
            <section class="mb-5">

                <h2 class="section-heading-line">
                    LEVELS & UPGRADES
                </h2>


                <div
                    id="levelsContainer"
                    class="row g-3"
                ></div>

            </section>


            <!-- EXTRA INFORMATION -->
            <section
                id="extraSection"
                class="mb-5"
            >

                <h2 class="section-heading-line">
                    ADDITIONAL INFORMATION
                </h2>


                <div
                    id="extraInfo"
                    class="row g-3"
                ></div>

            </section>


            <!-- BACK BUTTON -->
            <div class="text-center mt-5">

                <a
                    href="index.html"
                    class="navigation-button"
                >
                    ← BACK TO CHARACTERS
                </a>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->
<footer class="py-4 text-center">

    <p class="mb-0">
        © 2026 Clash Troops Database
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>

const DATA_BASE =
    "https://raw.githubusercontent.com/chiefpansancolt/clash-of-clans-data/main/data/home";

const IMAGE_BASE =
    "https://raw.githubusercontent.com/chiefpansancolt/clash-of-clans-data/main/";


const folderMap = {

    troop: "troops",
    spell: "spells",
    hero: "heroes",
    siegeMachine: "siege-machines",
    pet: "pets",
    equipment: "hero-equipment"

};


function formatCategory(category) {

    const names = {

        troop: "Troop",
        spell: "Spell",
        hero: "Hero",
        siegeMachine: "Siege Machine",
        pet: "Pet",
        equipment: "Equipment"

    };

    return names[category] || category;

}


function formatTime(time) {

    if (!time) {
        return "N/A";
    }

    const parts = [];

    if (time.days) {
        parts.push(`${time.days}d`);
    }

    if (time.hours) {
        parts.push(`${time.hours}h`);
    }

    if (time.minutes) {
        parts.push(`${time.minutes}m`);
    }

    if (time.seconds) {
        parts.push(`${time.seconds}s`);
    }

    return parts.length
        ? parts.join(" ")
        : "Instant";

}


function getImage(character) {

    if (character?.images?.icon) {
        return IMAGE_BASE + character.images.icon;
    }

    if (character?.levels?.[0]?.images?.normal) {
        return IMAGE_BASE + character.levels[0].images.normal;
    }

    return "";

}


function addBasicStat(title, value, icon = "") {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return;
    }


    const container =
        document.getElementById("basicStats");


    const col =
        document.createElement("div");

    col.className =
        "col-6 col-md-3";


    col.innerHTML = `

        <div class="stat-card h-100">

            <div class="level-label">
                ${icon} ${title}
            </div>

            <div class="level-stat">
                ${value}
            </div>

        </div>

    `;


    container.appendChild(col);

}


function addExtraInfo(title, value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return;
    }


    const container =
        document.getElementById("extraInfo");


    const col =
        document.createElement("div");

    col.className =
        "col-md-6";


    col.innerHTML = `

        <div class="info-card h-100">

            <div class="level-label">
                ${title}
            </div>

            <div class="level-stat">
                ${value}
            </div>

        </div>

    `;


    container.appendChild(col);

}


function displayLevels(character) {

    const container =
        document.getElementById("levelsContainer");


    if (
        !character.levels ||
        character.levels.length === 0
    ) {

        container.innerHTML = `

            <div class="col-12">

                <div class="level-card">

                    <p class="mb-0">
                        Level information is not available
                        for this character.
                    </p>

                </div>

            </div>

        `;

        return;
    }


    character.levels.forEach(level => {

        const normal =
            level.stats?.normal || {};


        const image =
            level.images?.normal
            ? IMAGE_BASE + level.images.normal
            : "";


        const col =
            document.createElement("div");

        col.className =
            "col-md-6 col-lg-4";


        col.innerHTML = `

            <div class="level-card h-100">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <span class="level-badge">
                        LEVEL ${level.level}
                    </span>

                    ${
                        level.townHallRequired !== undefined
                        ?
                        `
                        <span class="character-badge">
                            TH ${level.townHallRequired}
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    image
                    ?
                    `
                    <div class="text-center mb-3">

                        <img
                            src="${image}"
                            alt="Level ${level.level}"
                            style="max-width:120px; max-height:120px;"
                            onerror="this.style.display='none';"
                        >

                    </div>
                    `
                    :
                    ""
                }


                ${
                    level.hitpoints !== undefined
                    ?
                    `
                    <div class="mb-2">

                        <div class="level-label">
                            HITPOINTS
                        </div>

                        <div class="level-stat">
                            ❤️ ${level.hitpoints}
                        </div>

                    </div>
                    `
                    :
                    ""
                }


                ${
                    normal.dps !== undefined
                    ?
                    `
                    <div class="mb-2">

                        <div class="level-label">
                            DAMAGE PER SECOND
                        </div>

                        <div class="level-stat">
                            ⚔ ${normal.dps}
                        </div>

                    </div>
                    `
                    :
                    ""
                }


                ${
                    normal.damagePerShot !== undefined
                    ?
                    `
                    <div class="mb-2">

                        <div class="level-label">
                            DAMAGE PER SHOT
                        </div>

                        <div class="level-stat">
                            💥 ${normal.damagePerShot}
                        </div>

                    </div>
                    `
                    :
                    ""
                }


                ${
                    level.researchCost !== undefined &&
                    level.researchCost > 0
                    ?
                    `
                    <div class="mb-2">

                        <div class="level-label">
                            UPGRADE COST
                        </div>

                        <div class="level-stat">
                            💰 ${level.researchCost.toLocaleString()}
                            ${level.researchCostResource || ""}
                        </div>

                    </div>
                    `
                    :
                    ""
                }


                ${
                    level.researchTime
                    ?
                    `
                    <div>

                        <div class="level-label">
                            RESEARCH TIME
                        </div>

                        <div class="level-stat">
                            ⏱ ${formatTime(level.researchTime)}
                        </div>

                    </div>
                    `
                    :
                    ""
                }

            </div>

        `;


        container.appendChild(col);

    });

}


async function loadCharacter() {

    const params =
        new URLSearchParams(window.location.search);


    const id =
        params.get("id");

    const category =
        params.get("category");


    if (!id || !category) {

        showError(
            "Character information is missing."
        );

        return;

    }


    const folder =
        folderMap[category];


    if (!folder) {

        showError(
            "Invalid character category."
        );

        return;

    }


    try {

        const url =
            `${DATA_BASE}/${folder}/${id}.json`;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Character not found."
            );

        }


        const character =
            await response.json();


        displayCharacter(
            character,
            category
        );


    } catch (error) {

        showError(
            "Unable to load character information."
        );

    }

}


function displayCharacter(character, category) {

    document
        .getElementById("loading")
        .classList.add("d-none");


    document
        .getElementById("details")
        .classList.remove("d-none");


    document
        .getElementById("characterName")
        .textContent =
            character.name || "Unknown Character";


    document
        .getElementById("characterDescription")
        .textContent =
            character.description ||
            "No description available.";


    document
        .getElementById("characterCategory")
        .textContent =
            formatCategory(category);


    const image =
        getImage(character);


    const imageElement =
        document.getElementById("characterImage");


    if (image) {

        imageElement.src = image;

        imageElement.alt =
            character.name || "Character";

    } else {

        imageElement.style.display =
            "none";

    }


    // BASIC INFORMATION

    addBasicStat(
        "Movement Speed",
        character.movementSpeed,
        "🏃"
    );


    addBasicStat(
        "Attack Speed",
        character.attackSpeed,
        "⚔"
    );


    addBasicStat(
        "Range",
        character.range,
        "🎯"
    );


    addBasicStat(
        "Housing Space",
        character.housingSpace,
        "🏠"
    );


    addBasicStat(
        "Target",
        character.targetType,
        "🎯"
    );


    addBasicStat(
        "Damage Type",
        character.damageType,
        "💥"
    );


    addBasicStat(
        "Barrack Level",
        character.barrackLevelRequired,
        "🏰"
    );


    addBasicStat(
        "Donation Cost",
        character.donationCost?.amount,
        "💰"
    );


    // LEVELS

    displayLevels(character);


    // EXTRA INFORMATION

    addExtraInfo(
        "Category",
        formatCategory(category)
    );


    if (character.troopType) {

        addExtraInfo(
            "Troop Type",
            character.troopType
        );

    }


    if (character.specialAbility) {

        addExtraInfo(
            "Special Ability",
            character.specialAbility
        );

    }


    if (character.regularLevelRequired) {

        addExtraInfo(
            "Regular Level Required",
            character.regularLevelRequired
        );

    }


    if (character.boostCost) {

        addExtraInfo(
            "Boost Cost",
            `${character.boostCost.toLocaleString()} ${character.boostCostResource || ""}`
        );

    }

}


function showError(message) {

    document
        .getElementById("loading")
        .classList.add("d-none");


    const error =
        document.getElementById("errorMessage");


    error.textContent =
        message;


    error.classList.remove("d-none");

}


loadCharacter();

</script>

</body>
</html>
